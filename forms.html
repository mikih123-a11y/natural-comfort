<!DOCTYPE html>
<html lang="he" dir="rtl">

<body>

<!-- ============================================================
     העמוד הזה לא מיועד לגלישה.
     הוא קיים רק כדי ש-Netlify יזהה את הטופס "lead" בזמן הבנייה,
     ויאפשר לשלוח אליו לידים מההדמיה ולקבל עליהם התראה במייל.
     אין למחוק אותו.
     ============================================================ -->

<form name="lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field">
  <input name="name">
  <input name="phone">
  <input name="email">
  <input name="product">
  <input name="image">
  <input name="source">
  <input name="ip">
  <textarea name="notes"></textarea>
</form>

<p style="font-family:system-ui;padding:40px;text-align:center;color:#888">
  אין כאן תוכן. <a href="/">חזרה לאתר</a>
</p>

</body>
</html>
