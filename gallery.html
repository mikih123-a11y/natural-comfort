<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גלריית עבודות · Natural Comfort</title>
<meta name="description" content="עבודות שביצענו אצל לקוחות. גימורים אמיתיים בתאורה של בית.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FBFAF8">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<link rel="stylesheet" href="/site-header.css">
<link rel="stylesheet" href="/footer-upgrade.css">
<link rel="stylesheet" href="/premium-inner.css">
<style>
:root{
  --paper:#FBFAF8; --panel:#EFEBE4; --champagne:#A79A88; --champagne-lt:#C9BFAE;
  --ink:#211F1D; --ink-soft:#3B3733; --ink-mute:#5F584F; --oak:#B8894E; --champagne-txt:#8A6E42; --line:#E2DCD2;
  --display:"Frank Ruhl Libre",Georgia,serif; --body:"Assistant",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
main.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* הכותרת המשותפת: site-header.css */

.crumb{font-size:15px;color:var(--ink-soft);font-weight:400;padding:22px 0 0}
.crumb a:hover{color:var(--ink)}
.crumb i{font-style:normal;margin:0 8px;color:var(--champagne-lt)}

.head{padding:24px 0 8px;max-width:620px}
.kicker{font-size:11.5px;letter-spacing:.16em;color:var(--champagne);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,4.4vw,50px);line-height:1.08;letter-spacing:-.024em;margin-top:10px}
.head p{margin-top:14px;color:var(--ink-soft);font-size:16.5px;font-weight:400}

.filt{margin:32px 0 30px;display:flex;align-items:center;justify-content:center;gap:30px;overflow-x:auto;scrollbar-width:none;padding-bottom:11px;border-bottom:1px solid var(--line)}
.filt::-webkit-scrollbar{display:none}
.fx{padding:0 0 3px;border:0;background:none;font-size:16px;color:var(--ink-mute);white-space:nowrap;flex:none;border-bottom:1.5px solid transparent;transition:color .2s;min-height:32px}
.fx:hover{color:var(--ink)}
.fx[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--champagne-txt)}
.fx{min-height:44px}
/* בורר מובייל: במקום שורת טאבים, כפתור אחד שפותח חלון תחתון */
.pick{display:none;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0 16px;margin:24px 0 22px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--ink);text-align:start}
.pick b{font-weight:600}.pick .chev{font-size:18px;color:var(--ink-mute)}
.sheet{border:0;padding:0;margin:auto 0 0;width:100%;max-width:100%;background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0;box-shadow:0 -10px 40px #0003}
.sheet::backdrop{background:rgba(33,31,29,.45)}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.sheet .sh-head h2{font-family:var(--display);font-size:20px;font-weight:500}
.sheet .sh-close{min-width:44px;min-height:44px;font-size:22px;color:var(--ink-mute)}
.sheet ul{list-style:none;padding:4px 8px 22px;max-height:70vh;overflow:auto}
.sheet li button{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 12px;font-size:17px;color:var(--ink);text-align:start;border-radius:8px}
.sheet li button[aria-checked=true]{color:var(--champagne-txt);font-weight:600;background:var(--panel)}
.sheet li button .ck{width:22px;flex:none;text-align:center}
@media(max-width:640px){main.wrap{padding:0 20px}.filt{display:none}.pick{display:flex}.head{padding-top:16px}}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:22px;padding-bottom:70px}
.grid > .card{grid-column:span 2}
.grid[data-rem="2"] > .card:nth-last-child(-n+2){grid-column:span 3}
.grid[data-rem="1"] > .card:last-child{grid-column:2 / span 4}
.grid > .empty{grid-column:1/-1}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr;gap:16px}
  .grid > .card,.grid[data-rem="2"] > .card:nth-last-child(-n+2),.grid[data-rem="1"] > .card:last-child{grid-column:auto}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:#fff;overflow:hidden;text-align:start;width:100%;transition:.25s var(--ease)}
.card:hover{border-color:var(--champagne-lt);transform:translateY(-3px)}
.card .ph{aspect-ratio:3/4;overflow:hidden;background:var(--panel);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card:hover .ph img{transform:scale(1.03)}
.card .zoom{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .25s var(--ease);background:rgba(33,31,29,.18);pointer-events:none}
.card .zoom i{width:52px;height:52px;border-radius:50%;background:rgba(251,250,248,.94);display:grid;place-items:center;font-style:normal;font-size:22px;color:var(--ink)}
.card:hover .zoom,.card:focus-visible .zoom{opacity:1}
@media(hover:none){.card .zoom{display:none}}
.card .b{padding:16px 18px 18px;border-top:1px solid var(--line)}
.card b{display:block;font-family:var(--display);font-size:17px;font-weight:500}
.card small{display:block;font-size:14.5px;color:var(--ink-soft);font-weight:400;margin-top:4px}

.note{border-top:1px solid var(--line);padding:26px 0 70px;font-size:15.5px;color:var(--ink-soft);font-weight:400;max-width:680px}
.note a{color:var(--oak);text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-soft)}

.lb{position:fixed;inset:0;z-index:200;background:rgba(20,19,18,.94);display:none;align-items:center;justify-content:center;padding:32px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:88vh;width:auto;height:auto;object-fit:contain}
.lb-x{position:fixed;top:18px;inset-inline-end:22px;color:#fff;font-size:30px;line-height:1;font-weight:300;z-index:201;cursor:pointer}
.lb-cap{position:fixed;bottom:22px;inset-inline:0;text-align:center;color:#EDE9E2;font-size:16px;z-index:201;pointer-events:none}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="nc-header"></div>
<script src="/site-header.js"></script>

<main class="wrap">
  <div class="crumb"><a href="/">בית</a><i>·</i><span>גלריית עבודות</span></div>

  <div class="head">
    <h1>עבודות אצל לקוחות</h1>
    <p>תמונות מהתקנות אמיתיות, בתאורה של בית. כאן רואים איך הגימור נראה בפועל, לא רנדר.</p>
  </div>

  <div class="filt" id="filt"></div>
  <button class="pick" id="pick" type="button" aria-haspopup="dialog" aria-controls="sheet"><span>גימור: <b id="pick-val">הכול</b></span><span class="chev" aria-hidden="true">⌄</span></button>
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sh-head"><h2 id="sheet-title">גימור</h2><button class="sh-close" type="button" id="sheet-close" aria-label="סגירה">✕</button></div>
    <ul id="sheet-list" role="radiogroup"></ul>
  </dialog>
  <div class="grid" id="grid"></div>

  <p class="note" id="note"></p>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="תמונה מוגדלת">
  <button class="lb-x" id="lbx" type="button" aria-label="סגירה">&times;</button>
  <img id="lbimg" src="" alt="">
  <div class="lb-cap" id="lbcap"></div>
</div>

<footer class="footer"></footer>

<script>
const $ = s => document.querySelector(s);

fetch('/products/catalog.json').then(r => r.json()).then(d => {
  const items = ((d.gallery || {}).items) || [];
  if (!items.length) {
    $('#grid').innerHTML = '<div class="empty">בקרוב: תמונות מהתקנות אצל לקוחות.</div>';
    return;
  }

  const finishes = [...new Set(items.map(i => i.finish).filter(Boolean))];
  const opts = ['all', ...finishes];
  $('#filt').innerHTML = opts.map((f, i) =>
    `<button class="fx" data-f="${f}" aria-pressed="${!i}">${f === 'all' ? 'הכול' : f}</button>`).join('');
  $('#sheet-list').innerHTML = opts.map((f, i) =>
    `<li><button type="button" role="radio" data-f="${f}" aria-checked="${!i}"><span class="ck" aria-hidden="true">${!i ? '✓' : ''}</span>${f === 'all' ? 'הכול' : f}</button></li>`).join('');

  const card = it => `<button class="card" data-id="${it.id}" aria-label="הגדלת תמונה: ${[it.caption, it.finish && ('גימור ' + it.finish)].filter(Boolean).join(', ')}">
      <div class="ph"><img src="${it.thumb}" alt="${[it.caption, it.finish && ('גימור ' + it.finish)].filter(Boolean).join(', ') || 'עבודה אצל לקוח'}" loading="lazy">
        <span class="zoom" aria-hidden="true"><i>⌕</i></span></div>
      <div class="b"><b>${it.finish || ''}</b><small>${it.caption || ''}</small></div>
    </button>`;

  const show = f => {
    document.querySelectorAll('.fx').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === f));
    document.querySelectorAll('#sheet-list [role=radio]').forEach(b => { const on = b.dataset.f === f; b.setAttribute('aria-checked', on); b.querySelector('.ck').textContent = on ? '✓' : ''; });
    $('#pick-val').textContent = f === 'all' ? 'הכול' : f;
    const list = f === 'all' ? items : items.filter(i => i.finish === f);
    $('#grid').innerHTML = list.length ? list.map(card).join('')
      : '<div class="empty">אין עדיין תמונה בגימור הזה.</div>';
    // כמה תמונות נשארות בשורה האחרונה. בלי זה נפער חור בצד.
    $('#grid').dataset.rem = list.length ? String(list.length % 3) : '0';
  };
  show('all');

  // גלריה להדגמה בלבד. אין מחיר ואין קישור למוצר. ההזמנה תמיד מהקטלוג.
  $('#note').innerHTML = 'התמונות להדגמה בלבד. הגימורים, המידות והחלוקה הפנימית נקבעים בהתאמה אישית. '
    + 'לבחירה ולהזמנה עברו ל<a href="/#shop">קטלוג הדגמים</a>.';

  let lastCard = null;
  const openLb = it => {
    $('#lbimg').src = it.image;
    $('#lbimg').alt = `${it.finish || ''} ${it.caption || ''}`;
    $('#lbcap').textContent = [it.finish, it.caption].filter(Boolean).join(' · ');
    $('#lb').classList.add('open');
    document.body.style.overflow = 'hidden';
    $('#lbx').focus();
  };
  // סגירה מחזירה את המיקוד לתמונה שנפתחה, אחרת המקלדת מאבדת את המקום
  const closeLb = () => {
    $('#lb').classList.remove('open');
    document.body.style.overflow = '';
    if (lastCard) { lastCard.focus(); lastCard = null; }
  };

  const sheet = $('#sheet');
  $('#pick').onclick = () => { sheet.showModal(); (sheet.querySelector('[aria-checked=true]') || sheet.querySelector('[role=radio]')).focus(); };
  $('#sheet-close').onclick = () => sheet.close();
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
  $('#sheet-list').onclick = e => { const b = e.target.closest('[role=radio]'); if (b) { show(b.dataset.f); sheet.close(); $('#pick').focus(); } };

  document.addEventListener('click', e => {
    if (e.target.closest('#sheet') || e.target.closest('#pick')) return;
    const f = e.target.closest('.fx');
    if (f) return show(f.dataset.f);
    const c = e.target.closest('.card');
    if (c) { const it = items.find(x => x.id === c.dataset.id); if (it) { lastCard = c; openLb(it); } return; }
    if (e.target.closest('#lb')) closeLb();
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
}).catch(err => {
  console.error('gallery load error:', err);
  document.querySelector('#grid').innerHTML = '<div class="empty">שגיאה בטעינת הגלריה.</div>';
});
</script>
<script src="/footer-upgrade.js" defer></script>
<script src="/pwa.js" defer></script>
</body>
</html>
